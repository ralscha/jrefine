name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test release artifact
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Dogfood release artifact
        run: bash scripts/dogfood.sh

      - name: Verify artifact version and create checksum
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          actual_version="$(java -jar target/jrefine.jar --version)"
          if [[ "$actual_version" != "jrefine $release_version" ]]; then
            echo "Artifact version mismatch: $actual_version" >&2
            exit 1
          fi
          cd target
          sha256sum jrefine.jar > jrefine.jar.sha256
          sha256sum --check jrefine.jar.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          target/jrefine.jar
          target/jrefine.jar.sha256
          --verify-tag
          --generate-notes
          --title "${{ github.ref_name }}"
